services:
  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Port intentionally not published: only the stack talks to Postgres.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # Default build target is the last stage (development with
      # --watch). Production must use the lean runtime stage.
      target: production
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    command: >
      sh -c "bunx drizzle-kit migrate
      && bun src/db/seed.ts
      && bun src/index.ts"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Default build target is the last stage (development = vite dev
      # on :5173). Production must serve the nginx stage on :80.
      target: production
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
