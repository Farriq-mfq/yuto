server {
  listen 80;

  location /api {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Service worker: tidak pernah di-cache agar update terdeteksi.
  location = /sw.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  # Manifest: tidak pernah di-cache + MIME resmi.
  location = /manifest.webmanifest {
    root /usr/share/nginx/html;
    types {}
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Entry HTML: tidak pernah di-cache agar rilis baru langsung dipakai.
  location = /index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
  }

  # Aset build ber-hash (JS/CSS/font/…): immutable jangka panjang.
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    root /usr/share/nginx/html;
    # Fallback SPA ke index.html juga tidak di-cache.
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
