<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Yuto</title>
    <script>
      // Set class .dark sedini mungkin (sebelum module React) agar tanpa flash.
      // Cerminkan logika resolveDark system di src/lib/theme.ts.
      try {
        var yutoTheme = localStorage.getItem("yuto-theme");
        var yutoDark =
          yutoTheme === "dark" ||
          (yutoTheme !== "light" &&
            yutoTheme !== "dark" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        if (yutoDark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
